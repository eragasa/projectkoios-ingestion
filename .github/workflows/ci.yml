name: CI

on:
  workflow_dispatch:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Python 3.14 verification
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Check out ingestion candidate
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Install locked Python toolchain
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: "0.11.25"
          python-version: "3.14"
          enable-cache: false

      - name: Synchronize locked environment
        run: uv sync --locked --all-extras

      - name: Check owned Python formatting
        run: >-
          .venv/bin/python -m ruff format --check
          src/python/projectkoios/ingestion/reference_evidence.py
          src/python/projectkoios/ingestion/reference_locator.py
          src/python/projectkoios/ingestion/reference_claim_candidate.py
          tests/test__ReferenceEvidence.py
          tests/test__ReferencePageLocator.py
          tests/test__ReferenceClaimCandidate.py

      - name: Lint all Python
        run: >-
          .venv/bin/python -m ruff check
          src/python
          workflow
          cpn
          scripts
          tests
          docs/sphinx

      - name: Type-check all production source
        run: >-
          .venv/bin/python -m mypy
          src/python
          workflow
          cpn
          scripts

      - name: Run full test suite
        run: .venv/bin/python -m pytest -q

      - name: Build Sphinx API documentation
        run: >-
          .venv/bin/sphinx-build -W --keep-going -b html
          docs/sphinx
          /tmp/projectkoios-ingestion-sphinx

      - name: Build source and wheel distributions
        run: uv build --out-dir dist

      - name: Verify clean wheel installation
        run: |
          uv venv /tmp/projectkoios-ingestion-wheel --python 3.14 --clear
          uv pip install --python /tmp/projectkoios-ingestion-wheel/bin/python \
            "projectkoios @ git+https://github.com/eragasa/projectkoios.git@233f36900b9b44c943ecc5e27f2968ad4bee97ad" \
            dist/*.whl
          /tmp/projectkoios-ingestion-wheel/bin/python - <<'PY'
          from importlib import import_module
          from importlib.util import find_spec

          from projectkoios.ingestion import (
              ReferenceClaimCandidate,
              ReferencePageLocatorChecker,
          )
          from projectkoios.ingestion.base.data.object import AbstractDataObject
          from projectkoios.ingestion.base.inventory.identity.error import (
              InventoryIdentityError,
          )
          from projectkoios.ingestion.base.inventory.identity.model import (
              InventoryIdentity,
          )
          from projectkoios.ingestion.base.materializer.identity.error import (
              MaterializationIdentityError,
          )
          from projectkoios.ingestion.base.materializer.identity.model import (
              MaterializerIdentity,
          )
          from projectkoios.ingestion.base.projector.identity.error import (
              ProjectionIdentityError,
          )
          from projectkoios.ingestion.base.projector.identity.model import (
              ProjectorIdentity,
          )
          from projectkoios.ingestion.base.projector.payload.error import (
              ProjectionPayloadError,
          )
          from projectkoios.ingestion.storage.extraction.projection.projector import (
              ExtractionProjectionProjector,
          )
          assert ReferenceClaimCandidate is not None
          assert ReferencePageLocatorChecker is not None
          assert AbstractDataObject is not None
          assert InventoryIdentity is not None
          assert InventoryIdentityError is not None
          assert MaterializerIdentity is not None
          assert MaterializationIdentityError is not None
          assert ProjectorIdentity is not None
          assert ProjectionIdentityError is not None
          assert ProjectionPayloadError is not None
          assert ExtractionProjectionProjector is not None

          required_modules = (
              "projectkoios.ingestion.base.pipeline.actionizer",
              "projectkoios.ingestion.integrations.sqlite.processing.state.store",
              "projectkoios.ingestion.storage.processing.state.base",
              "projectkoios.ingestion.storage.extraction.artifact.validation.actionizer",
              "projectkoios.ingestion.storage.extraction.freeze.bounded.actionizer",
              "projectkoios.ingestion.storage.extraction.journal.publication.actionizer",
              "projectkoios.ingestion.storage.extraction.materialization.evidence.collection",
              "projectkoios.ingestion.storage.extraction.projection.index.readiness.definition",
              "projectkoios.ingestion.storage.extraction.projection.pipeline.actionizer",
              "projectkoios.ingestion.storage.extraction.projection.read.model",
              "projectkoios.ingestion.storage.extraction.recovery.subset.actionizer",
              "projectkoios.ingestion.ocr.cache.identity",
              "projectkoios.ingestion.ocr.failure",
              "projectkoios.ingestion.ocr.identity.resource.language",
              "projectkoios.ingestion.ocr.reference.native.text.block",
              "projectkoios.ingestion.ocr.processor",
              "projectkoios.ingestion.ocr.request",
              "projectkoios.ingestion.ocr.result.ocr",
              "projectkoios.ingestion.ocr.selection",
              "projectkoios.ingestion.ocr.validation.reference",
              "projectkoios.ingestion.ocr.validation.request",
              "projectkoios.ingestion.ocr.validation.result",
              "projectkoios.ingestion.ocr.validation.selection",
              "projectkoios.ingestion.reconciliation.derivation.match",
              "projectkoios.ingestion.reconciliation.derivation.native",
              "projectkoios.ingestion.reconciliation.derivation.stream",
              "projectkoios.ingestion.reconciliation.derivation.warning",
              "projectkoios.ingestion.reconciliation.evidence.native.block",
              "projectkoios.ingestion.reconciliation.segment.native.line",
              "projectkoios.ingestion.reconciliation.validation.request",
              "projectkoios.ingestion.reconciliation.validation.result",
              "projectkoios.ingestion.tables.structure.derivation.cell",
              "projectkoios.ingestion.tables.structure.derivation.column",
              "projectkoios.ingestion.tables.structure.derivation.continuation",
              "projectkoios.ingestion.tables.structure.derivation.region",
              "projectkoios.ingestion.tables.structure.derivation.structure",
              "projectkoios.ingestion.tables.structure.limits.definition",
              "projectkoios.ingestion.tables.structure.limits.error",
              "projectkoios.ingestion.tables.structure.model",
              "projectkoios.ingestion.tables.structure.record.source",
              "projectkoios.ingestion.tables.structure.reconstructor.base",
              "projectkoios.ingestion.tables.structure.reconstructor.deterministic",
              "projectkoios.ingestion.tables.structure.role.cell",
              "projectkoios.ingestion.tables.structure.specification.warning",
              "projectkoios.ingestion.tables.structure.status.evidence",
              "projectkoios.ingestion.tables.structure.validation.cell",
              "projectkoios.ingestion.tables.structure.validation.column",
              "projectkoios.ingestion.tables.structure.validation.continuation",
              "projectkoios.ingestion.tables.structure.validation.row",
              "projectkoios.ingestion.tables.structure.validation.structure",
          )
          for module_name in required_modules:
              import_module(module_name)

          removed_modules = (
              "projectkoios.ingestion.integrations.mongodb.extraction.index_readiness",
              "projectkoios.ingestion.integrations.sqlite.processing_state",
              "projectkoios.ingestion.storage.processing_state",
              "projectkoios.ingestion.storage.extraction.artifact_validation",
              "projectkoios.ingestion.storage.extraction.bounded_freeze",
              "projectkoios.ingestion.storage.extraction.journal_publication",
              "projectkoios.ingestion.storage.extraction.projection_pipeline",
              "projectkoios.ingestion.storage.extraction.projection.index_readiness",
              "projectkoios.ingestion.storage.extraction.selected_recovery",
              "projectkoios.ingestion.ocr._geometry",
              "projectkoios.ingestion.ocr._identity",
              "projectkoios.ingestion.ocr._limits",
              "projectkoios.ingestion.ocr._primitives",
              "projectkoios.ingestion.ocr._validation",
              "projectkoios.ingestion.ocr.cache_key",
              "projectkoios.ingestion.ocr.failure_kind",
              "projectkoios.ingestion.ocr.language_resource_identity",
              "projectkoios.ingestion.ocr.limit_error",
              "projectkoios.ingestion.ocr.native_text_block_reference",
              "projectkoios.ingestion.ocr.output_mode",
              "projectkoios.ingestion.ocr.page_image",
              "projectkoios.ingestion.ocr.processor_identity",
              "projectkoios.ingestion.ocr.resource_identity_kind",
              "projectkoios.ingestion.ocr.result_status",
              "projectkoios.ingestion.ocr.selection_result",
              "projectkoios.ingestion.ocr.selection_status",
              "projectkoios.ingestion.reconciliation._candidate",
              "projectkoios.ingestion.reconciliation._derivation",
              "projectkoios.ingestion.reconciliation._geometry",
              "projectkoios.ingestion.reconciliation._identity",
              "projectkoios.ingestion.reconciliation._limits",
              "projectkoios.ingestion.reconciliation._primitives",
              "projectkoios.ingestion.reconciliation._validation",
              "projectkoios.ingestion.reconciliation.item_kind",
              "projectkoios.ingestion.reconciliation.limit_error",
              "projectkoios.ingestion.reconciliation.match_kind",
              "projectkoios.ingestion.reconciliation.native_block_evidence",
              "projectkoios.ingestion.reconciliation.native_line_segment",
              "projectkoios.ingestion.reconciliation.stream_choice",
              "projectkoios.ingestion.tables.structure.bounds",
              "projectkoios.ingestion.tables.structure.cell_derivation",
              "projectkoios.ingestion.tables.structure.cell_role",
              "projectkoios.ingestion.tables.structure.cell_validation",
              "projectkoios.ingestion.tables.structure.column_derivation",
              "projectkoios.ingestion.tables.structure.column_validation",
              "projectkoios.ingestion.tables.structure.continuation_derivation",
              "projectkoios.ingestion.tables.structure.continuation_validation",
              "projectkoios.ingestion.tables.structure.evidence_status",
              "projectkoios.ingestion.tables.structure.limit_error",
              "projectkoios.ingestion.tables.structure.reconstruction",
              "projectkoios.ingestion.tables.structure.region_derivation",
              "projectkoios.ingestion.tables.structure.row_validation",
              "projectkoios.ingestion.tables.structure.source_record",
              "projectkoios.ingestion.tables.structure.structure",
              "projectkoios.ingestion.tables.structure.warning_specification",
          )
          for module_name in removed_modules:
              if find_spec(module_name) is not None:
                  raise AssertionError(f"legacy module remains: {module_name}")

          removed_package_exports = (
              ("projectkoios.ingestion.ocr.result", "OCRResult"),
              (
                  "projectkoios.ingestion.tables.structure.derivation",
                  "TableStructureDerivation",
              ),
              (
                  "projectkoios.ingestion.tables.structure.reconstructor",
                  "DeterministicTableStructureReconstructor",
              ),
              (
                  "projectkoios.ingestion.tables.structure.validation",
                  "TableStructureValidation",
              ),
          )
          for package_name, removed_name in removed_package_exports:
              if removed_name in vars(import_module(package_name)):
                  raise AssertionError(
                      f"legacy package export remains: {package_name}.{removed_name}"
                  )
          PY

      - name: Check patch whitespace
        run: git diff --check HEAD
