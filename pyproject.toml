[project]
name = "projectkoios-ingestion"
version = "0.0.0"
description = "source ingestion and document processing pipeline"
readme = "README.md"
requires-python = ">=3.14"
license = "Apache-2.0"
authors = [
    { name = "Eugene Ragasa", email = "eugene@projectkoios.com" },
]
dependencies = ["projectkoios==0.0.0"]

[project.scripts]
koios-ingest-pdf = "projectkoios.ingestion.cli:main"
koios-ingest-pdf-batch = "projectkoios.ingestion.batch_cli:main"
koios-plan-pdf-corpus = "projectkoios.ingestion.corpus_plan_cli:main"
koios-validate-pdf-corpus = "projectkoios.ingestion.corpus_validation_cli:main"
koios-detect-pdf-equations-batch = "projectkoios.ingestion.equation_batch_cli:main"
koios-plan-pdf-transcripts-batch = "projectkoios.ingestion.transcript_plan_cli:main"
koios-compose-pdf-transcripts-batch = "projectkoios.ingestion.transcript_batch_cli:main"
koios-run-selective-ocr = "projectkoios.ingestion.ocr_batch_cli:main"

[build-system]
requires = ["setuptools==84.0.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src/python"]
namespaces = true

[project.optional-dependencies]
pdf = ["PyMuPDF>=1.24"]
mathml = ["latex2mathml>=3.81"]
dev = ["pytest>=8.0", "ruff>=0.8", "mypy>=1.13", "PyMuPDF>=1.24", "latex2mathml>=3.81", "mongomock==4.3.0"]
mongodb = ["pymongo==4.18.2"]
layout-detector = [
    "numpy==2.4.3",
    "onnxruntime==1.24.4",
    "Pillow==12.1.1",
]
workflow = ["SNAKES==0.9.33"]
docs = [
    "sphinx>=8.2,<10",
]
layout-reading-order = [
    "docling-core==2.101.1",
    "docling-slim==2.135.0",
    "Rtree==1.4.1",
]

[tool.uv.sources]
projectkoios = { git = "https://github.com/eragasa/projectkoios.git", rev = "233f36900b9b44c943ecc5e27f2968ad4bee97ad" }
snakes = { git = "https://github.com/eragasa/projectkoios-snakes.git", rev = "72dbb1dbf0a91349faca21ceb660923cc442a8e9" }

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = [
    "ignore:builtin type SwigPyPacked has no __module__ attribute:DeprecationWarning",
    "ignore:builtin type SwigPyObject has no __module__ attribute:DeprecationWarning",
    "ignore:builtin type swigvarlink has no __module__ attribute:DeprecationWarning",
]
markers = [
    "benchmark: deterministic benchmark regression checks",
    "private_integration: requires explicitly configured private local resources",
    "smoke: verifies package structure and direct import availability",
]

[tool.ruff]
line-length = 80
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
"workflows/*.py" = ["E501"]

[tool.mypy]
mypy_path = "src/python"
namespace_packages = true
explicit_package_bases = true

[[tool.mypy.overrides]]
module = ["projectkoios.chunking", "projectkoios.repositories.*"]
ignore_missing_imports = true

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
