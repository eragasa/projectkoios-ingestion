[project]
name = "projectkoios-ingestion"
version = "0.0.0"
description = "source ingestion and document processing pipeline"
readme = "README.md"
requires-python = ">=3.14"
license = "Apache-2.0"
authors = [
    { name = "Eugene Ragasa", email = "eugene@projectkoios.com" },
]
dependencies = ["projectkoios==0.0.0"]

[project.scripts]
koios-ingest-pdf = "projectkoios.ingestion.cli:main"
koios-ingest-pdf-batch = "projectkoios.ingestion.batch_cli:main"
koios-detect-pdf-equations-batch = "projectkoios.ingestion.equation_batch_cli:main"
koios-enrich-pdf-equations-batch = "projectkoios.ingestion.equation_enrichment_cli:main"

[build-system]
requires = ["setuptools>=61.0.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src/python"]
namespaces = true

[project.optional-dependencies]
pdf = ["PyMuPDF>=1.24"]
mathml = ["latex2mathml>=3.81"]
dev = ["pytest>=8.0", "ruff>=0.8", "mypy>=1.13", "PyMuPDF>=1.24", "latex2mathml>=3.81"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 80
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
mypy_path = "src/python"
namespace_packages = true
explicit_package_bases = true

[[tool.mypy.overrides]]
module = ["projectkoios.chunking", "projectkoios.repositories.*"]
ignore_missing_imports = true

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
